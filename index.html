<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Lubona ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial}
canvas{display:block;width:100vw;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
let w,h,dpr,particles=[],words=[];
const rand=(a,b)=>Math.random()*(b-a)+a;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 w=innerWidth;h=innerHeight;
 c.width=w*dpr;c.height=h*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 make();
}
function make(){
 particles=[];words=[];
 const s=Math.min(w*.037, h*.018, 14);
 for(let i=0;i<650;i++){
  let t=rand(0,Math.PI*2);
  let x=16*Math.pow(Math.sin(t),3);
  let y=13*Math.cos(t)-5*Math.cos(2*t)
       -2*Math.cos(3*t)-Math.cos(4*t);
  particles.push({
   x:x*s+rand(-9,9),
   y:-y*s+rand(-9,9),
   r:rand(1,4),
   phase:rand(0,7),
   speed:rand(.5,2)
  });
 }
 for(let i=0;i<65;i++){
  words.push({
   x:rand(-.1,1.1)*w,
   y:rand(h*.20,h*.80),
   size:rand(7,16),
   speed:rand(.12,.55),
   phase:rand(0,7),
   heart:Math.random()>.5
  });
 }
}
function draw(ms){
 let t=ms/1000;
 ctx.clearRect(0,0,w,h);
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,w,h);

 // Floating love messages
 words.forEach(a=>{
  let y=(a.y-t*a.speed*12+h)%h;
  ctx.globalAlpha=.35+.55*
   Math.abs(Math.sin(t*.7+a.phase));
  ctx.font=a.size+"px Arial";
  ctx.fillStyle=a.heart?"#ff1765":"#ffcfdb";
  ctx.fillText(
   a.heart?"❤️ I Love You ❤️":"I Love You 💗",
   a.x,y
  );
 });
 ctx.globalAlpha=1;

 // Beating particle heart
 const cx=w/2,cy=h/2;
 const beat=1+.045*Math.sin(t*7)
             +.025*Math.sin(t*14);
 ctx.save();
 ctx.translate(cx,cy);
 ctx.scale(beat,beat);

 particles.forEach(p=>{
  let x=p.x+Math.sin(t*p.speed+p.phase)*2;
  let y=p.y+Math.cos(t*p.speed+p.phase)*2;
  ctx.globalAlpha=.5+.5*
    Math.abs(Math.sin(t*2+p.phase));
  ctx.shadowBlur=12;
  ctx.shadowColor="#ff1493";
  ctx.fillStyle=["#ff1493","#ff69b4",
   "#ff007f","#ffb6d9"][Math.floor(p.phase)%4];
  ctx.font=(p.r*3+4)+"px Arial";
  ctx.fillText("♥",x,y);
 });
 ctx.restore();
 ctx.globalAlpha=1;
 ctx.shadowBlur=0;

 // Lubona in the center
 const fs=Math.min(w*.12,48);
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.font="italic bold "+fs+"px cursive";
 ctx.shadowColor="#ff0066";
 ctx.shadowBlur=22;
 ctx.fillStyle="#fff4f8";
 ctx.fillText("Lubona",cx,cy);
 ctx.shadowBlur=12;
 ctx.font="28px Arial";
 ctx.fillStyle="#ff3388";
 ctx.fillText("♡",cx,cy+45);
 ctx.shadowBlur=0;
 ctx.textAlign="start";

 requestAnimationFrame(draw);
}
addEventListener("resize",resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
